# Pre-commit hooks for agent-skills.
# Deterministic quality gates that run on every commit.
#
# Install: brew install pre-commit betterleaks && bin/setup-hooks
# Run manually: pre-commit run --all-files

repos:
  # Secret scanning (BPE-based, 98.6% recall)
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.4.1
    hooks:
      - id: betterleaks

  # Local hooks
  - repo: local
    hooks:
      # Unicode artifact check (non-breaking spaces, smart quotes, em dashes)
      - id: asciicheck
        name: Check for non-ASCII artifacts
        entry: python3 bin/asciicheck.py
        language: python
        types: [text]
        exclude: (^_archive/|^docs/internal/|plugins/.*/skills/.*/SKILL\.md$|^plugins/docs/skills/humanizer/references/|\.vale/)

      # Prose quality (diff-based Vale, skips SKILL.md and code blocks)
      - id: check-prose
        name: Prose quality (Vale)
        entry: bin/check-prose
        language: script
        types: [markdown]
        pass_filenames: false

      # Commit message quality (Vale ai-tells-commits)
      - id: vale-commit-msg
        name: Commit message quality (Vale)
        entry: vale --no-global --ext=.md
        language: system
        stages: [commit-msg]

      # Refresh ~/.agents/skills after every commit. The agents dir is a
      # flat COPY (opencode's skill discovery does not follow symlinks,
      # verified 2026-08-05), so freshness depends on re-running the
      # installer; this hook makes the committed state the installed state.
      - id: sync-agent-skills
        name: Sync agent skills (post-commit)
        entry: bin/install-skills . --agents-only
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false
